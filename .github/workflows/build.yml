name: Build Pulse Clock APK

on:
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v4

  - name: Setup Android project
    run: |
      mkdir -p app/src/main/assets
      mkdir -p app/src/main/java/com/pulse/clock
      mkdir -p app/src/main/res/values

      if [ -f index.html ]; then
        cp index.html app/src/main/assets/index.html
      elif [ -f app/src/main/assets/index.html ]; then
        echo "index.html already exists"
      else
        echo "ERROR: index.html not found"
        exit 1
      fi

  - name: Create Android Manifest
    run: |
      cat > app/src/main/AndroidManifest.xml <<'EOF'
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <application
              android:theme="@android:style/Theme.Material.NoActionBar"
              android:label="Pulse Clock"
              android:usesCleartextTraffic="false">
              <activity
                  android:name=".MainActivity"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>
              </activity>
          </application>
      </manifest>
      EOF

  - name: Create MainActivity
    run: |
      cat > app/src/main/java/com/pulse/clock/MainActivity.java <<'EOF'
      package com.pulse.clock;

      import android.app.Activity;
      import android.os.Bundle;
      import android.webkit.WebView;
      import android.webkit.WebSettings;
      import android.view.View;
      import android.view.Window;
      import android.graphics.Color;

      public class MainActivity extends Activity {
          private WebView webView;

          @Override
          protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().setStatusBarColor(Color.rgb(9, 13, 24));
              getWindow().setNavigationBarColor(Color.rgb(9, 13, 24));

              webView = new WebView(this);
              webView.setBackgroundColor(Color.rgb(9, 13, 24));

              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);

              setContentView(webView);
              webView.loadUrl("file:///android_asset/index.html");
          }

          @Override
          public void onBackPressed() {
              if (webView != null && webView.canGoBack()) {
                  webView.goBack();
              } else {
                  super.onBackPressed();
              }
          }
      }
      EOF

  - name: Create Gradle settings
    run: |
      cat > settings.gradle <<'EOF'
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }
      dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories {
              google()
              mavenCentral()
          }
      }
      rootProject.name = "PulseClock"
      include(":app")
      EOF

      cat > build.gradle <<'EOF'
      plugins {
          id 'com.android.application' version '8.5.2' apply false
      }
      EOF

      cat > gradle.properties <<'EOF'
      org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
      android.useAndroidX=true
      EOF

      cat > app/build.gradle <<'EOF'
      plugins {
          id 'com.android.application'
      }

      android {
          namespace 'com.pulse.clock'
          compileSdk 35

          defaultConfig {
              applicationId 'com.pulse.clock'
              minSdk 23
              targetSdk 28
              versionCode 1
              versionName '1.0'
          }
      }
      EOF

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - uses: gradle/actions/setup-gradle@v3
    with:
      gradle-version: '8.7'

  - name: Build APK
    run: gradle assembleDebug --no-daemon

  - name: List APK
    run: ls -lh app/build/outputs/apk/debug/

  - uses: actions/upload-artifact@v4
    with:
      name: Pulse-Clock-APK
      path: app/build/outputs/apk/debug/app-debug.apk
